aid: abuseipdb
name: AbuseIPDB
description: >-
  AbuseIPDB is a community-driven project to help system administrators, webmasters, and security analysts check the
  reputation of IP addresses and report malicious activity. The free APIv2 surface lets developers query a single IP,
  check a CIDR block, retrieve paginated reports, download a curated blacklist, submit single or bulk abuse reports, and
  clear their own past reports for an address. AbuseIPDB underpins fail2ban, UFW, Cloudflare WAF, Wazuh, Splunk SOAR,
  and dozens of other firewall and SIEM integrations across the security community.
